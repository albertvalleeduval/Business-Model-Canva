<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Model Canvas</title>
  <meta name="description" content="Interactive Business Model Canvas — edit, save, and export to PDF." />

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          gap: { '4': '1rem' },
          borderRadius: { 'xl': '0.75rem' },
        },
      },
    };
  </script>

  <!-- Project Stylesheet -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-white min-h-screen p-5 md:p-8">

  <div id="bmc-root" class="max-w-[1400px] mx-auto">

    <!-- ═══════ HEADER ═══════ -->
    <header class="flex flex-wrap items-center justify-between gap-4 mb-5">
      <h1 class="text-lg md:text-xl font-bold text-gray-800 tracking-tight flex items-center gap-2">
        <span
          class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-indigo-50 text-indigo-500 text-sm font-black">◆</span>
        Business Model Canvas
      </h1>

      <div class="flex flex-wrap items-center gap-5 text-sm text-gray-500">
        <label class="flex items-center gap-1.5">
          <span class="font-semibold text-gray-600 text-xs uppercase tracking-wide">Designed for</span>
          <span class="header-field" contenteditable="true" data-placeholder="…" id="hdr-designed-for"></span>
        </label>
        <label class="flex items-center gap-1.5">
          <span class="font-semibold text-gray-600 text-xs uppercase tracking-wide">Designed by</span>
          <span class="header-field" contenteditable="true" data-placeholder="…" id="hdr-designed-by"></span>
        </label>
        <label class="flex items-center gap-1.5">
          <span class="font-semibold text-gray-600 text-xs uppercase tracking-wide">Date</span>
          <span class="header-field" contenteditable="true" data-placeholder="…" id="hdr-date"></span>
        </label>
        <label class="flex items-center gap-1.5">
          <span class="font-semibold text-gray-600 text-xs uppercase tracking-wide">Version</span>
          <span class="header-field" contenteditable="true" data-placeholder="…" id="hdr-version"></span>
        </label>
      </div>
    </header>

    <!-- ═══════ CANVAS GRID ═══════ -->
    <main id="canvas-grid">

      <!-- Key Partnerships -->
      <section class="bmc-card block-kp">
        <div class="card-header">
          <span class="card-icon bg-violet-100 text-violet-600">🤝</span>
          <h2>Key Partnerships</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-kp"
          data-placeholder="Who are your key partners and suppliers?"></div>
      </section>

      <!-- Key Activities -->
      <section class="bmc-card block-ka">
        <div class="card-header">
          <span class="card-icon bg-blue-100 text-blue-600">⚡</span>
          <h2>Key Activities</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-ka"
          data-placeholder="What key activities does your value proposition require?"></div>
      </section>

      <!-- Key Resources -->
      <section class="bmc-card block-kr">
        <div class="card-header">
          <span class="card-icon bg-sky-100 text-sky-600">🏗️</span>
          <h2>Key Resources</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-kr"
          data-placeholder="What key resources does your value proposition require?"></div>
      </section>

      <!-- Value Propositions -->
      <section class="bmc-card block-vp">
        <div class="card-header">
          <span class="card-icon bg-amber-100 text-amber-600">🎁</span>
          <h2>Value Propositions</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-vp"
          data-placeholder="What value do you deliver to the customer?"></div>
      </section>

      <!-- Customer Relationships -->
      <section class="bmc-card block-cr">
        <div class="card-header">
          <span class="card-icon bg-rose-100 text-rose-600">❤️</span>
          <h2>Customer Relationships</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-cr"
          data-placeholder="What type of relationship does each segment expect?"></div>
      </section>

      <!-- Channels -->
      <section class="bmc-card block-ch">
        <div class="card-header">
          <span class="card-icon bg-teal-100 text-teal-600">🚚</span>
          <h2>Channels</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-ch"
          data-placeholder="Through which channels do your segments want to be reached?"></div>
      </section>

      <!-- Customer Segments -->
      <section class="bmc-card block-cs">
        <div class="card-header">
          <span class="card-icon bg-emerald-100 text-emerald-600">👥</span>
          <h2>Customer Segments</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-cs" data-placeholder="For whom are you creating value?">
        </div>
      </section>

      <!-- Cost Structure -->
      <section class="bmc-card block-cost">
        <div class="card-header">
          <span class="card-icon bg-red-100 text-red-600">💰</span>
          <h2>Cost Structure</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-cost"
          data-placeholder="What are the most important costs in your business model?"></div>
      </section>

      <!-- Revenue Streams -->
      <section class="bmc-card block-rev">
        <div class="card-header">
          <span class="card-icon bg-green-100 text-green-600">💵</span>
          <h2>Revenue Streams</h2>
        </div>
        <div class="editable" contenteditable="true" id="block-rev"
          data-placeholder="For what value are your customers willing to pay?"></div>
      </section>

    </main>

    <!-- ═══════ EXPORT BUTTON ═══════ -->
    <div class="flex justify-end mt-5">
      <button id="export-btn"
        class="flex items-center gap-2 bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-md cursor-pointer">
        <span class="btn-label flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 10v6m0 0l-3-3m3 3l3-3M3 17v3a2 2 0 002 2h14a2 2 0 002-2v-3" />
          </svg>
          Export PDF
        </span>
        <span class="btn-spinner spinner" style="display:none;"></span>
      </button>
    </div>

  </div>

  <!-- html2pdf.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>

  <!-- Application Logic -->
  <script src="./app.js"></script>
</body>

</html>
