    <rect x="18.8" y="5"  width="3.6" height="6"  rx="0.8"/>
    <rect x="18.8" y="12" width="3.6" height="6"  rx="0.8"/>
    <!-- Customer Segments (full-height right col) -->
    <rect x="23.4" y="5"  width="3.6" height="13" rx="0.8"/>
    <!-- Cost Structure / Revenue Streams (bottom bar) -->
    <rect x="5"    y="19" width="10.5" height="8" rx="0.8"/>
    <rect x="16.5" y="19" width="10.5" height="8" rx="0.8"/>
  </g>
  <!-- Value Proposition (center, highlighted) -->
